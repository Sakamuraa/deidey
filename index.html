      property="og:description"

    <meta property="og:url" content="https://deidey.vtube-info.xyz/" />

    <!-- The tab icon is the avatar itself, same file the social card uses.
         iOS ignores WebP for touch icons, so that one stays PNG. -->
    <link rel="icon" type="image/png" href="/og-image.png" />
    <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Deidey",
        "alternateName": ["@Deidey", "@deidey16_"],
        "description": "Isekai Rabbit Warrior dari Praedisium. ID VTuber, Live 2D.",
        "url": "https://deidey.vtube-info.xyz/",
        "image": "https://deidey.vtube-info.xyz/media/avatar-youtube.webp",
        "sameAs": [
          "https://www.youtube.com/@Deidey",
          "https://x.com/deidey16_",
          "https://shopee.co.id/deideyisekaistore"
        ]
      }
    </script>

    <script>
      // Runs before first paint so the correct token set is already on screen.
      // Without this, a dark-mode visitor eats one light flash on every load.
      (function () {
        try {
          var stored = localStorage.getItem("deidey-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? "light" : "dark");
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
